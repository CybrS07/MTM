name: Deploy Supabase (SQL and Edge Functions)

on:
  push:
    branches: [main]
    paths: ["supabase/**", "sql/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # Runtime secrets for the Edge Functions (optional for the deploy itself)
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      SENDER_NAME: ${{ secrets.SENDER_NAME }}
      PIN_PEPPER: ${{ secrets.PIN_PEPPER }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      ALLOWED_ORIGIN: ${{ secrets.ALLOWED_ORIGIN }}
    steps:
      - uses: actions/checkout@v4

      # Only the three secrets the CLI itself needs can stop the deploy.
      - name: Check the deploy secrets
        run: |
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::Missing GitHub secret for $v"; missing=1; fi
          done
          exit $missing

      # The Edge Function secrets only warn. A missing one means that feature fails at runtime, not that the deploy fails.
      - name: Warn about missing Edge Function secrets
        run: |
          for v in BREVO_API_KEY SENDER_EMAIL SENDER_NAME PIN_PEPPER GEMINI_API_KEY GEMINI_MODEL ALLOWED_ORIGIN; do
            if [ -z "${!v}" ]; then echo "::warning::GitHub secret $v is not set. It will not be pushed to Supabase."; fi
          done

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      # sql/schema.sql is the single source of truth. The CLI only reads supabase/migrations, so copy it in here.
      # The file is idempotent (create if not exists, drop policy if exists), so re-running it is safe.
      - name: Apply SQL (remote database)
        run: |
          mkdir -p supabase/migrations
          cp sql/schema.sql supabase/migrations/20260101000000_schema.sql
          supabase db push --yes

      # Push only the secrets that are set, so a missing one never overwrites a good value on Supabase with an empty string.
      - name: Set Edge Function secrets
        run: |
          args=()
          for v in BREVO_API_KEY SENDER_EMAIL SENDER_NAME PIN_PEPPER GEMINI_API_KEY GEMINI_MODEL ALLOWED_ORIGIN; do
            if [ -n "${!v}" ]; then args+=("$v=${!v}"); fi
          done
          if [ ${#args[@]} -eq 0 ]; then echo "No Edge Function secrets to set."; exit 0; fi
          supabase secrets set --remote="$PROJECT_REF" --yes "${args[@]}"

      - name: Deploy Edge Functions
        run: supabase functions deploy --remote="$PROJECT_REF" --yes --no-verify-jwt
