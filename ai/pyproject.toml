[project]
name = "mind-to-machine-ai"
version = "1.0.0"
description = "Gemini message reader for the Mind to Machine planner (standard library only)"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.7"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E9", "F"]  # imports, syntax errors, unused names
