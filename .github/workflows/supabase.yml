name: Deploy Supabase (SQL and Edge Functions)

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Apply SQL migrations
        run: supabase db push
      - name: Set Edge Function secrets
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            BREVO_API_KEY="$BREVO_API_KEY" \
            SENDER_EMAIL="$SENDER_EMAIL" \
            SENDER_NAME="$SENDER_NAME" \
            PIN_PEPPER="$PIN_PEPPER" \
            GEMINI_API_KEY="$GEMINI_API_KEY" \
            GEMINI_MODEL="$GEMINI_MODEL" \
            ALLOWED_ORIGIN="$ALLOWED_ORIGIN"
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          PIN_PEPPER: ${{ secrets.PIN_PEPPER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          ALLOWED_ORIGIN: ${{ secrets.ALLOWED_ORIGIN }}
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF" --no-verify-jwt
